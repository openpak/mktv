{{define "page"}}{{template "head" .}}
<div class="page-head">
  <p class="eyebrow">Mario Kart 8, 8 Deluxe, 7 and Wii</p>
  <h1>OpenKart</h1>
  <p class="lede">Rankings, ghosts and tournaments for Mario Kart on the OpenPak network. Pick your game.</p>
</div>
<ul class="games">
{{range .Games}}<li><a class="card game-card" href="{{.Home}}">
  <span class="eyebrow">{{.Console}}</span>
  <b>{{.Name}}</b>
  <span class="muted">{{.Intro}}</span>
</a></li>
{{end}}</ul>
{{template "foot" .}}{{end}}
